name: Gerar APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descompactar projeto (se enviado em .zip)
        run: if [ -f encomendas.zip ]; then unzip -o encomendas.zip; fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Usar servidores alternativos
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/espelhos.gradle <<'EOF'
          def espelhos = [
            "https://maven-central.storage-download.googleapis.com/maven2/",
            "https://repo1.maven.org/maven2/"
          ]
          settingsEvaluated { s ->
            espelhos.each { u ->
              s.pluginManagement.repositories.maven { url = u }
              s.dependencyResolutionManagement.repositories.maven { url = u }
            }
          }
          EOF

      - name: Compilar
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: Encomendas-APK
          path: app/build/outputs/apk/debug/app-debug.apk
